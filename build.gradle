plugins {
  id 'net.fabricmc.fabric-loom'
  id 'maven-publish'
}

base {
  archivesName = "${project.archives_base_name}-${project.minecraft_version}"
}
version = project.mod_version
group = project.maven_group

repositories {
  // Add repositories to retrieve artifacts from in here.
  // You should only use this when depending on other mods because
  // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
  // See https://docs.gradle.org/current/userguide/declaring_repositories.html
  // for more information about repositories.
}

sourceSets {
  gametest {
    compileClasspath += main.compileClasspath + main.output
    runtimeClasspath += main.runtimeClasspath + main.output
  }
}

loom {
  mods {
    quarrymod {
      sourceSet sourceSets.main
    }
    "quarrymod-gametest" {
      sourceSet sourceSets.gametest
    }
  }

  runs {
    gametest {
      server()
      name "Game Test"
      vmArg "-Dfabric-api.gametest"
      vmArg "-Dfabric-api.gametest.report-file=${layout.buildDirectory.get().asFile}/gametest/junit.xml"
      runDir "build/gametest"
      source sourceSets.gametest
    }
  }
}

dependencies {
  // To change the versions see the gradle.properties file
  minecraft "com.mojang:minecraft:${project.minecraft_version}"
  implementation "net.fabricmc:fabric-loader:${project.loader_version}"

  // Fabric API. This is technically optional, but you probably want it anyway.
  implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

  // PSA: Some older mods, compiled on Loom 0.2.1, might have outdated Maven POMs.
  // You may need to force-disable transitiveness on them.

  api ("TechReborn:TechReborn-${project.tr_version}") { exclude group: "net.fabricmc.fabric-api" exclude group: "RebornCore" exclude group: "mezz.jei"}
  api ("RebornCore:RebornCore-${project.rc_version}") { exclude group: "net.fabricmc.fabric-api"}
}

processResources {
  inputs.property "version", project.version

  filesMatching("fabric.mod.json") {
    expand "version": project.version
  }
}

tasks.withType(JavaCompile).configureEach {
  // ensure that the encoding is set to UTF-8, no matter what the system default is
  // this fixes some edge cases with special characters not displaying correctly
  // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
  // If Javadoc is generated, this must be specified in that task too.
  it.options.encoding = "UTF-8"

  // Minecraft 1.18 (1.18-pre2) upwards uses Java 17.
  it.options.release = project.java_version as Integer
}

java {
  // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
  // if it is present.
  // If you remove this line, sources will not be generated.
  withSourcesJar()

  sourceCompatibility = JavaVersion.toVersion(project.java_version)
  targetCompatibility = JavaVersion.toVersion(project.java_version)
}

jar {
  from("LICENSE") {
    rename { "${it}_${base.archivesName.get()}"}
  }
}

// configure the maven publication
publishing {
  publications {
    mavenJava(MavenPublication) {
      groupId = 'net.quarrymod'
      artifactId = 'fabric-quarry'
      version = "${project.mod_version}+${project.minecraft_label}"
      from components.java
    }
  }
  

  // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
  repositories {
    maven {
      name = "GitHubPackages"
      url = "https://maven.pkg.github.com/ted-inc/fabricquarry"
      credentials {
        username = System.getenv("GITHUB_ACTOR")
        password = System.getenv("GITHUB_TOKEN")
      }
    }
  }
}

def gametestJar = tasks.register("gametestJar", Jar) {
  from sourceSets.gametest.output
  archiveClassifier = "gametest"
}

tasks.register("remapGametestJar") {
  dependsOn gametestJar
}
