name: Publish release

on:
  release:
    types: [published]

permissions:
  contents: write
  packages: write

jobs:
  publish-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4

      - name: Read Java version
        id: props
        run: echo "java=$(grep -E '^java_version' gradle.properties | cut -d= -f2 | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: Set up JDK ${{ steps.props.outputs.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.props.outputs.java }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and run game tests
        run: |
          chmod +x gradlew
          ./gradlew build runGametest

      - name: Attach jar to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          jars=$(find build/libs -name '*.jar' ! -name '*-sources.jar' ! -name '*-gametest*.jar')
          echo "Uploading: $jars"
          gh release upload "${{ github.event.release.tag_name }}" $jars --clobber

      - name: Publish to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew publish
